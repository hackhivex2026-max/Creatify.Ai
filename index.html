<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CREATIFY AI — Working Prototype</title>
<style>
:root{--bg:#050817;--surf:#131C3D;--blue:#315CFF;--purple:#753BFF;--violet:#B54AFF;--mag:#F03BCB;--tx:#F7F8FF;--tx2:#A6B1D2;--bd:rgba(150,130,255,.2);--ease:cubic-bezier(.22,.8,.3,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{height:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Manrope","Segoe UI",system-ui,sans-serif;line-height:1.55;overflow-x:hidden;min-height:100%}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:10px}
.atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
.o1{width:44vw;height:44vw;right:-8vw;top:-12vw;background:radial-gradient(circle,var(--purple),transparent 65%);animation:dr 28s ease-in-out infinite alternate}
.o2{width:42vw;height:42vw;left:-14vw;bottom:-8vw;background:radial-gradient(circle,var(--blue),transparent 65%);opacity:.32;animation:dr 34s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translate3d(4vw,4vh,0) scale(1.07)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 22%,#fff8,transparent),radial-gradient(1px 1px at 68% 14%,#fff7,transparent),radial-gradient(1.5px 1.5px at 84% 62%,#c9b8ff99,transparent),radial-gradient(1px 1px at 30% 78%,#fff6,transparent)}
.nav{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(1260px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 8px 20px;border-radius:999px;border:1px solid var(--bd);background:rgba(11,18,48,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav.s{background:rgba(5,8,23,.88)}
.logo{font-weight:800;display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--violet))}
.links{display:flex;gap:0}
.lk{position:relative;background:none;border:0;cursor:pointer;padding:10px 9px;font-size:.8rem;color:var(--tx2);transition:color .25s;white-space:nowrap}
.lk:hover,.lk[aria-current]{color:var(--tx)}
.lk[aria-current]::after{content:"";position:absolute;left:50%;bottom:0;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet)}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:transparent;cursor:pointer;font-size:1.2rem}
.drawer{position:fixed;z-index:49;top:calc(76px + env(safe-area-inset-top,0px));left:14px;right:14px;padding:10px;border-radius:22px;border:1px solid var(--bd);background:rgba(5,8,23,.96);display:none;flex-direction:column}
.drawer.open{display:flex}.drawer .lk{text-align:left;padding:14px;font-size:.92rem}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--bd);font-weight:600;font-size:.92rem;cursor:pointer;background:rgba(255,255,255,.05);transition:transform .3s var(--ease),box-shadow .3s,border-color .3s,background-position .6s}
.btn:hover{translate:0 -2px;scale:1.025}.btn:active{scale:.975}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:.84rem}
.btn.p{border-color:transparent;background:linear-gradient(110deg,var(--blue),var(--purple),var(--violet));background-size:200% 100%}
.btn.p:hover{background-position:100% 0;box-shadow:0 10px 34px -8px rgba(117,59,255,.85)}
.btn.g:hover{border-color:rgba(181,74,255,.6);box-shadow:0 0 24px -6px rgba(181,74,255,.5)}
.btn.d{border-color:rgba(240,59,100,.5);color:#ff8fa8}
main{position:relative;z-index:2;width:min(1220px,calc(100% - 40px));margin:0 auto;padding:116px 0 60px;min-height:100vh}
.view{animation:in .45s var(--ease)}@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:clamp(2.5rem,6vw,5rem);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:20px 0}
h2{font-size:clamp(1.8rem,3.6vw,2.8rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 8px}
h3{margin:.6em 0 .3em}
.grad{background:linear-gradient(100deg,#7d8fff,var(--violet) 55%,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--tx2)}.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;border:1px solid var(--bd);background:rgba(19,28,61,.6);font-size:.85rem;color:var(--tx2)}
.badge b{width:8px;height:8px;border-radius:50%;background:var(--mag);box-shadow:0 0 10px var(--mag)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.sp{justify-content:space-between}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;min-height:calc(100vh - 200px)}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:560px;justify-self:end}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fb{position:absolute;padding:14px 18px;border-radius:20px;border:1px solid var(--bd);background:rgba(19,28,61,.72);backdrop-filter:blur(14px);box-shadow:0 20px 50px -20px #000;animation:bob 7s ease-in-out infinite alternate}
.fb strong{display:block;font-size:1.6rem;line-height:1.1}.fb span{font-size:.8rem;color:var(--tx2)}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
.card{border-radius:22px;border:1px solid var(--bd);background:rgba(19,28,61,.6);backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.cr{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:relative;display:block;width:100%;text-align:left;padding:0;overflow:hidden;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.cr:hover{border-color:rgba(181,74,255,.6);box-shadow:0 24px 50px -24px rgba(117,59,255,.8)}
.cr::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(181,74,255,.18),transparent 70%)}
.cr:hover::before{opacity:1}
.th{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--g);cursor:pointer;display:block}
.th::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;transition:transform .6s var(--ease);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.22),transparent 38%),radial-gradient(circle at 78% 82%,rgba(0,0,0,.45),transparent 55%)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.85}
.cr:hover .th::before{transform:scale(1.07)}
.th em{position:absolute;left:12px;bottom:12px;z-index:2;font-style:normal;font-size:.76rem;padding:5px 12px;border-radius:999px;background:rgba(5,8,23,.75);border:1px solid var(--bd)}
.in{padding:14px 18px 18px}.in h3{margin:0;font-size:1.05rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tags span,.tag{font-size:.74rem;padding:4px 10px;border-radius:999px;background:rgba(117,59,255,.16);border:1px solid var(--bd)}
.tag{display:inline-block;margin:2px 4px 2px 0}
.bar{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}
input:not([type=checkbox]),textarea,select,.inp{width:100%;min-height:46px;padding:11px 16px;border-radius:14px;border:1px solid var(--bd);background:rgba(19,28,61,.6);transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus,.inp:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(181,74,255,.18)}
select option{background:#0b1230;color:#F7F8FF}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--violet);flex-shrink:0}
[aria-invalid=true]{border-color:#ff8fa8}
textarea{resize:vertical}
.search{flex:1 1 260px}.search .inp{border-radius:999px;padding:0 20px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;transition:all .25s}
.chip:hover{color:var(--tx)}.chip[aria-pressed=true]{color:var(--tx);border-color:transparent;background:linear-gradient(110deg,var(--blue),var(--purple))}
.fchip{padding:4px 12px;border-radius:99px;font-size:.82rem;border:1px solid rgba(181,74,255,.5);background:rgba(117,59,255,.18)}
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;border:1px dashed var(--bd);border-radius:22px;color:var(--tx2)}
.panel{padding:18px;margin:14px 0;border-radius:18px;border:1px solid var(--bd);background:rgba(19,28,61,.6)}
.note{padding:12px 16px;margin:12px 0;border-radius:14px;border:1px solid rgba(245,215,110,.35);background:rgba(245,215,110,.07);color:#f5d76e;font-size:.9rem}
.ok{padding:12px 16px;margin:12px 0;border-radius:14px;border:1px solid rgba(61,220,151,.4);background:rgba(61,220,151,.08);color:#7de8b8;font-size:.9rem}
.b{display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border-radius:999px;font-size:.76rem;border:1px solid}
.b.v{color:#3ddc97;border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.1)}.b.s{color:#f5d76e;border-color:rgba(245,215,110,.45);background:rgba(245,215,110,.08)}.b.n{color:var(--tx2);border-color:var(--bd)}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;font-weight:800;flex-shrink:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
label{display:grid;gap:5px;font-size:.85rem;color:var(--tx2);font-weight:600}
label.ck{display:flex;gap:10px;align-items:center}
.req::after{content:" *";color:#ff8fa8}
.narrow{max-width:800px;margin:0 auto}
.form{display:grid;gap:14px;padding:26px}.form.plain{padding:0}
.fe{color:#ff8fa8;font-size:.82rem;min-height:1em;font-weight:400}
.err{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,100,130,.45);background:rgba(255,60,100,.08);color:#ffb3c2;font-size:.9rem}
.img{width:100%;height:230px;object-fit:cover;display:block;border-radius:14px;background:var(--surf)}
.nofb{height:230px;display:flex;flex-direction:column;justify-content:center;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple))}
.modal{position:fixed;inset:0;background:rgba(5,8,23,.82);display:grid;place-items:center;z-index:80;padding:16px;backdrop-filter:blur(6px)}
.mbox{background:var(--surf);border:1px solid var(--bd);border-radius:22px;max-width:760px;max-height:92vh;overflow:auto;width:100%;padding:22px;animation:in .3s var(--ease)}
details summary{cursor:pointer}
.prof{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:36px;align-items:start}
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tl{margin-top:40px;padding:26px;display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.steps{list-style:none;margin:16px 0 0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--blue),var(--mag));opacity:.45}
.steps li{position:relative;padding-left:56px;margin-bottom:10px}
.step{width:100%;text-align:left;cursor:pointer;padding:12px 16px;border-radius:16px;border:1px solid var(--bd);background:rgba(19,28,61,.5);transition:all .3s var(--ease)}
.step:hover{translate:3px 0;border-color:rgba(181,74,255,.45)}.step small{display:block;color:var(--tx2)}
.dot{position:absolute;left:10px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--bg);border:2px solid var(--blue);transition:all .3s}
.on .dot{border-color:var(--mag);background:var(--mag);box-shadow:0 0 0 5px rgba(240,59,203,.18),0 0 18px var(--mag)}
.on .step{border-color:rgba(181,74,255,.6);background:rgba(117,59,255,.16)}
.ev{padding:18px;border-radius:20px;border:1px solid var(--bd);background:rgba(5,8,23,.6);align-self:start;position:sticky;top:96px}
.shot{aspect-ratio:16/10;border-radius:14px;background:var(--g);margin-bottom:14px}
.aiw{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:18px;align-items:start}
.ag{display:flex;flex-direction:column;gap:8px}
.agb{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;border:1px solid var(--bd);background:rgba(19,28,61,.5);cursor:pointer;text-align:left;transition:all .25s}
.agb:hover{border-color:rgba(181,74,255,.5)}.agb[aria-pressed=true]{border-color:var(--violet);background:rgba(117,59,255,.2);box-shadow:0 0 24px -8px var(--violet)}
.agb i{font-style:normal;font-size:1.2rem}.agb strong{font-size:.9rem}
.work{padding:22px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #fff4;border-top-color:#fff;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.dash{display:grid;grid-template-columns:200px 1fr;gap:20px;transition:grid-template-columns .3s var(--ease)}.dash.c{grid-template-columns:64px 1fr}
.side{padding:12px;display:flex;flex-direction:column;gap:6px;align-self:start}
.side button{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:0;background:transparent;cursor:pointer;color:var(--tx2);text-align:left;white-space:nowrap;overflow:hidden}
.side button:hover{background:rgba(117,59,255,.12)}.side button[aria-pressed=true]{background:rgba(117,59,255,.25);color:var(--tx)}
.c .lbl{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}.stat{padding:18px}.stat strong{font-size:2rem;display:block}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd);font-size:.9rem}th{color:var(--tx2);font-weight:600}
.foot{padding:30px 0 10px;text-align:center;color:var(--tx2);font-size:.82rem}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:12px 20px;border-radius:14px;border:1px solid var(--bd);background:var(--surf);transition:all .35s var(--ease);pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
#space{position:absolute;inset:0;width:100%;height:100%}
.artframe{justify-self:end;width:100%;max-width:520px;border-radius:28px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 30px 80px -30px rgba(117,59,255,.6)}.artframe img{display:block;width:100%;height:auto}
.btn,.lk,.chip,.agb,.step,.side button,.logo,.stat{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .22s var(--ease),translate .3s var(--ease),scale .3s var(--ease),box-shadow .3s,border-color .3s,background .3s,color .25s,background-position .6s}
.dlg{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:rgba(3,5,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:in .25s var(--ease)}
.dlg>div{width:min(420px,100%);padding:24px;border-radius:22px;border:1px solid var(--bd);background:var(--surf);box-shadow:0 30px 80px -20px #000}
.dlg p{margin:0 0 16px}.dlgin{width:100%;min-height:46px;margin-bottom:16px;padding:0 16px;border-radius:14px;border:1px solid var(--bd);background:rgba(5,8,23,.6)}.dlgin:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(181,74,255,.18)}
.sech{margin:60px 0 18px;font-size:clamp(1.5rem,3vw,2.1rem)}
.fx{padding:22px;display:flex;flex-direction:column;gap:10px}.fx h3{margin:0}.fx p{margin:0;color:var(--tx2);font-size:.92rem}.fx .n{font-size:.78rem;letter-spacing:.14em;color:var(--violet)}.fx .btn{align-self:flex-start;margin-top:auto}
.tg{align-self:flex-start;font-size:.74rem;padding:4px 10px;border-radius:999px;border:1px solid var(--bd)}.tg.ok{color:#3ddc97;background:rgba(61,220,151,.1)}.tg.sim{color:#ffc46b;background:rgba(255,196,107,.1)}.tg.be{color:#b9a6ff;background:rgba(117,59,255,.16)}
.intro .nav,.intro .drawer,.intro .foot{display:none}
.intro main{display:flex;align-items:center;padding:24px 0;min-height:100vh}.intro main>div:first-child{width:100%}.intro .hero{min-height:0;padding:20px 0}
.o1{animation:dr1 18s ease-in-out infinite alternate}.o2{animation:dr2 22s ease-in-out infinite alternate}
.o3{width:30vw;height:30vw;left:38vw;top:30vh;background:radial-gradient(circle,var(--mag),transparent 65%);opacity:.2;animation:dr3 26s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate3d(-14vw,16vh,0) scale(1.18)}}@keyframes dr2{to{transform:translate3d(16vw,-14vh,0) scale(1.14)}}@keyframes dr3{to{transform:translate3d(-18vw,12vh,0) scale(1.35)}}
.aur{position:absolute;left:-30%;width:160%;height:42vh;opacity:.55;will-change:transform}
.a1{top:4vh;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(181,74,255,.4),rgba(49,92,255,.2) 50%,transparent 72%);animation:aur1 19s ease-in-out infinite alternate}
.a2{top:50vh;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(49,92,255,.36),rgba(117,59,255,.18) 50%,transparent 72%);animation:aur2 25s ease-in-out infinite alternate}
@keyframes aur1{from{transform:translateX(-9%) rotate(-9deg) scaleY(.8)}to{transform:translateX(9%) rotate(-2deg) scaleY(1.5)}}
@keyframes aur2{from{transform:translateX(8%) rotate(6deg) scaleY(1.3)}to{transform:translateX(-8%) rotate(1deg) scaleY(.8)}}
.gw{position:absolute;left:0;right:0;bottom:0;height:48vh;overflow:hidden;perspective:520px;opacity:.5;-webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%)}
.gp{position:absolute;left:-60%;right:-60%;top:0;height:calc(100% + 64px);transform-origin:50% 100%;background-image:linear-gradient(rgba(150,130,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(150,130,255,.22) 1px,transparent 1px);background-size:64px 64px;animation:gm 7s linear infinite;will-change:transform}
@keyframes gm{from{transform:rotateX(62deg) translateY(0)}to{transform:rotateX(62deg) translateY(64px)}}
.rd{position:absolute;left:50%;top:50%;border:1px solid rgba(181,74,255,.24);border-radius:50%;will-change:transform}
.rd::after{content:"";position:absolute;width:7px;height:7px;left:100%;top:50%;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#B54AFF;box-shadow:0 0 10px #B54AFF}
.rd1{width:94vw;height:38vw;margin:-19vw 0 0 -47vw;animation:rs1 70s linear infinite}
.rd2{width:78vw;height:52vw;margin:-26vw 0 0 -39vw;border-color:rgba(49,92,255,.26);animation:rs2 110s linear infinite reverse}
.rd3{width:110vw;height:26vw;margin:-13vw 0 0 -55vw;animation:rs3 150s linear infinite}
@keyframes rs1{to{transform:rotate(360deg)}}@keyframes rs2{from{transform:rotate(35deg)}to{transform:rotate(395deg)}}@keyframes rs3{from{transform:rotate(-22deg)}to{transform:rotate(338deg)}}
.stars{animation:tw 7s ease-in-out infinite alternate}@keyframes tw{from{opacity:1}to{opacity:.4}}
.lite .gw,.lite .a2,.lite .rd3{display:none}@media(max-width:700px){.gw,.a2,.rd3{display:none}}
#app{transition:opacity .8s ease}body.st-on #app{opacity:0}
#sting{position:fixed;inset:0;z-index:200;background:#000;animation:stbg .7s ease 3.55s forwards}
#sting.out{opacity:0;transition:opacity .35s ease}
@keyframes stbg{to{opacity:0}}
.st-art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.st-zoom{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;animation:stz .85s cubic-bezier(.6,0,.9,.35) 3.3s forwards}
@keyframes stz{to{transform:scale(7);opacity:0}}
.st-c{width:min(46vw,250px);height:auto;overflow:visible;filter:drop-shadow(0 0 16px rgba(181,74,255,.7));animation:stp .7s ease-out 1.9s both}

.st-c path{stroke-dasharray:440;stroke-dashoffset:440;mix-blend-mode:screen;transform:translateX(var(--x));animation:std 1.05s cubic-bezier(.5,0,.2,1) var(--d) both,stc 1s cubic-bezier(.7,0,.3,1) 1.15s both}

@keyframes stw{to{opacity:1;transform:none;filter:blur(0)}}

#stskip{position:absolute;z-index:4;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#dfe3ff;cursor:pointer;opacity:0;animation:stk .4s ease .6s forwards}
@keyframes stk{to{opacity:1}}

function matchBrief(b){const lc=a=>a.map(x=>x.toLowerCase()),has=(arr,s)=>lc(arr).some(x=>x.includes(s.toLowerCase()));

  const sk=c.skills.concat(c.portfolioProjects.flatMap(p=>p.skills||[])),rs=csv(b.skills).filter(s=>has(sk,s)),rt=csv(b.tools).filter(s=>has(c.tools,s));

   ss=ss.filter(s=>{s.x+=s.v;s.y+=s.v*.45;const g=x.createLinearGradient(s.x-100,s.y-45,s.x,s.y);g.addColorStop(0,'rgba(181,74,255,0)');g.addColorStop(1,'rgba(240,235,255,.9)');x.strokeStyle=g;x.lineWidth=1.5;x.beginPath();x.moveTo(s.x-100,s.y-45);x.lineTo(s.x,s.y);x.stroke();return s.x<W+120&&s.y<H+120})}}
 function loop(t){mx+=(tx-mx)*.04;my+=(ty-my)*.04;draw(t);raf=requestAnimationFrame(loop)}
 function start(){cancelAnimationFrame(raf);if(!reduce&&!document.hidden)raf=requestAnimationFrame(loop)}
 size();addEventListener('resize',size);document.addEventListener('visibilitychange',start);
 if(reduce)addEventListener('scroll',()=>draw(0),{passive:true});else{start();if(fine){addEventListener('pointermove',e=>{tx=e.clientX/W-.5;ty=e.clientY/H-.5;px0=e.clientX;py0=e.clientY},{passive:true});document.addEventListener('mouseout',e=>{if(!e.relatedTarget)px0=py0=-999})}}})();

if((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4)document.body.classList.add('lite');
